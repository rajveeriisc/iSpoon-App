# Key-only access. Hostinger ships 50-cloud-init.conf with
# PasswordAuthentication yes, which overrode both the main sshd_config and
# 60-cloudimg-settings.conf because sshd honours the first match it sees.
# This file sorts ahead of all of them on purpose.
PasswordAuthentication no
KbdInteractiveAuthentication no
# root may still log in, but only with a key.
PermitRootLogin prohibit-password
