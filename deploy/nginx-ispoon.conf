# Upstream as a named block so connections to Node can be kept alive. Without
# this nginx opens a fresh TCP connection to the app for every single request.
upstream ispoon_api {
    server 127.0.0.1:5000;
    keepalive 32;
    keepalive_timeout 60s;
}

server {
    server_name srv2047744.hstgr.cloud;

    # MAX_FILE_SIZE is 5 MB; leave headroom for multipart overhead so nginx
    # does not reject an upload the app would have accepted.
    client_max_body_size 6m;

    # Do not advertise the nginx version to the internet.
    server_tokens off;

    # The app returns JSON. nginx has gzip on globally but its default
    # gzip_types is text/html ONLY, so every API response was going out
    # uncompressed. Analytics and meal-history payloads are the large ones.
    gzip on;
    gzip_types application/json application/javascript text/plain text/css;
    gzip_min_length 512;   # below this the header costs more than it saves
    gzip_comp_level 5;     # 5 is the knee; 6-9 burn CPU on 1 vCPU for ~2%
    gzip_vary on;
    gzip_proxied any;

    # Hold the client connection open so a burst of API calls during a meal
    # pays the TLS handshake once instead of per request.
    keepalive_timeout 75s;
    keepalive_requests 500;



    location / {
        proxy_pass http://ispoon_api;
        # Both required for upstream keepalive: HTTP/1.1, and an EMPTY
        # Connection header. This previously sent Connection: "upgrade" on
        # every request for a websocket the backend does not have, which
        # forced nginx to close the upstream connection each time.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        # TRUST_PROXY=true in the app, so these are what rate limiting and
        # request logs actually bucket on.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    # HTTP/2: certbot does not enable it. One connection carries many
    # concurrent API calls, which is exactly the app start-up pattern.
    http2 on;
    ssl_certificate /etc/letsencrypt/live/srv2047744.hstgr.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/srv2047744.hstgr.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = srv2047744.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name srv2047744.hstgr.cloud;
    return 404; # managed by Certbot
}
