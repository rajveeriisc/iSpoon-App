org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=true
kotlin.incremental=true
android.enableR8=true
# Faster Kotlin daemon
kotlin.daemon.jvm.options=-Xmx4g -XX:+UseParallelGC
# Network resilience
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=3
systemProp.org.gradle.internal.repository.max.tentatives=3

# local disk build to avoid external SSD corruption
android.defaults.buildfeatures.buildconfig=true
