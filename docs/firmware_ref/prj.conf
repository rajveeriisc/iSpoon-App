
# =========================================================================
#  I SPOON — prj.conf   (nRF52840, NCS v3.3.1 / Zephyr 4.3, SoftDevice Ctlr)
#  Pair with:  boards/nrf52840dk_nrf52840.overlay
# =========================================================================

# ---------------- Core drivers ----------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_WATCHDOG=y
CONFIG_POWEROFF=y     # sys_poweroff() for System OFF deep sleep
CONFIG_REBOOT=y

# ---------------- Kernel / libc ----------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BUILD_OUTPUT_STRIPPED=y
CONFIG_OVERRIDE_FRAME_POINTER_DEFAULT=y
CONFIG_STACK_POINTER_RANDOM=100
# Catch stack corruption / hard faults before they become "random weekly
# reboots". Near-zero runtime cost on Cortex-M4 with MPU.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_FAULT_DUMP=0
CONFIG_EXCEPTION_DEBUG=n
CONFIG_EARLY_CONSOLE=n

# Floating point (bite-counter maths: sqrtf/logf, and %f logging)
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# ---------------- Low-frequency clock ----------------
# This board has NO 32.768 kHz crystal — run LFCLK from the internal RC
# oscillator (matches the known-good bring-up). Selecting XTAL on a board
# without an LFXO makes BLE unstable / stalls at boot.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

# ---------------- Production diagnostics ----------------
# Runtime diagnostic output is disabled in the release configuration so
# health/bond details and fault state are not exposed over UART/RTT. Use
# debug.conf as an EXTRA_CONF_FILE for controlled bench builds.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n

# ---------------- Bluetooth: base ----------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="iSpoon Pro"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
# Allow nRF Connect to link even if bond UI is cancelled once.
CONFIG_BT_BONDING_REQUIRED=n
CONFIG_BT_SMP_SC_ONLY=y
# No PIN/passkey on display — Just Works LESC pairing (no MITM).
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_SMP_MIN_ENC_KEY_SIZE=16
# Stable random static address is easier to find in nRF Connect than RPA.
CONFIG_BT_PRIVACY=n
CONFIG_BT_FILTER_ACCEPT_LIST=n

# Persist the single owner bond and the local IRK in the MCUboot-managed
# settings partition.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_BT_SETTINGS=y

# Standard Device Information Service. The revision is derived from VERSION.
CONFIG_BT_DIS=y
CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="iSpoon Pro"
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="iSpoon"
CONFIG_BT_DIS_PNP=n

# Standard Battery Service — readable without bonding so the app can show
# SOC during "Preparing…" before product-service subscription/encrypt.
CONFIG_BT_BAS=y

# Stable, authenticated product identity exposed by the custom GATT service.
CONFIG_HWINFO=y
CONFIG_ISPOON_HW_REV="A1"

# ---------------- Bluetooth: MTU exchange ----------------
CONFIG_BT_GATT_CLIENT=y

# ---------------- Bluetooth: 2M PHY ----------------
CONFIG_BT_PHY_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# ---------------- Bluetooth: Data Length Extension ----------------
CONFIG_BT_DATA_LEN_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_BUF_ACL_TX_SIZE=502
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_L2CAP_TX_MTU=498

# ---------------- Bluetooth: TX buffering ----------------
CONFIG_BT_ATT_TX_COUNT=6
CONFIG_BT_CONN_TX_MAX=6
CONFIG_BT_BUF_ACL_TX_COUNT=6

# NOTE (SoftDevice Controller): do NOT add CONFIG_BT_CTLR_DATA_LENGTH_MAX
# or CONFIG_BT_CTLR_RX_BUFFERS — those exist only for the Zephyr LL.

# ---------------- Signed OTA: MCUboot + MCUmgr/SMP over BLE ----------------
# The bootloader itself is enabled in sysbuild.conf. Only image-management and
# reset groups are exposed; shell, filesystem and arbitrary settings groups are
# deliberately not enabled.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_IMG_VERSION_CMP_USE_BUILD_NUMBER=y
CONFIG_MCUMGR_GRP_IMG_TOO_LARGE_SYSBUILD=y
# A staged image must boot in TEST mode and confirm itself from the running
# application. Never allow an MCUmgr client to make an unbooted slot permanent.
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_IMAGE_SECONDARY=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_SLOT=n
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=n
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# Encrypted link required; no MITM/passkey (matches product GATT).
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=2475
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4608

# Application hooks reject upload/reset while the heater is active.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_UPLOAD_CHECK_HOOK=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_MCUBOOT_BOOTLOADER_NO_DOWNGRADE=y
